<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <defs>
    <style>
      .panel { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.12; }
      .line { fill: none; stroke: #eef2f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 5; }
      .label { fill: #b4c0cb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
      .title { fill: #eef2f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
      .accent { fill: #e6c36a; }
      .accent2 { fill: #67d6c2; }
    </style>
  </defs>

  <rect class="panel" x="24" y="24" width="852" height="372" rx="18" />
  <text class="title" x="52" y="62">Gorge hook + handline (schematic)</text>

  <!-- Handline: comes from the fisher (left) and ends lashed at the gorge middle -->
  <path class="thin" d="M 120 120 C 220 96, 300 168, 390 156 C 450 148, 500 148, 516 160 C 522 170, 520 184, 520 196" />
  <text class="label" x="52" y="170">Line (cordage)</text>
  <path class="thin" d="M 148 162 L 126 130" />

  <!-- Gorge stick -->
  <path class="line" d="M 440 214 L 600 214" />
  <text class="label" x="262" y="220">Gorge (bone/wood)</text>
  <path class="thin" d="M 412 216 L 436 214" />

  <!-- Lashing wraps at the middle -->
  <path class="thin" d="M 513 206 L 513 222" />
  <path class="thin" d="M 520 206 L 520 222" />
  <path class="thin" d="M 527 206 L 527 222" />
  <circle class="accent2" cx="520" cy="198" r="5" />
  <text class="label" x="600" y="170">Tie at middle (8-12 wraps)</text>
  <path class="thin" d="M 594 174 L 528 196" />

  <!-- Notches near each end -->
  <path class="thin" d="M 456 209 L 462 219 L 468 209" />
  <path class="thin" d="M 572 209 L 578 219 L 584 209" />
  <text class="label" x="628" y="250">Small notches near the ends</text>
  <path class="thin" d="M 622 246 L 584 220" />

  <!-- Bait covering the gorge -->
  <ellipse class="dashed" cx="520" cy="214" rx="48" ry="22" />
  <text class="label" x="600" y="300">Bait covers the gorge</text>
  <path class="thin" d="M 594 294 L 552 230" />

  <!-- Toggle note -->
  <text class="label" x="52" y="348">When swallowed, a pull turns the gorge sideways and it catches.</text>
</svg>
