<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <style>
      .panel { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.12; }
      .line { fill: none; stroke: #eef2f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #b4c0cb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.01em; }
      .title { fill: #eef2f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
      .accent { fill: #e6c36a; }
      .accent2 { fill: #67d6c2; }
    </style>
  </defs>

  <!-- Panel A: Top view -->
  <rect class="panel" x="28" y="30" width="404" height="460" rx="18" />
  <text class="title" x="52" y="68">Top view: hearth + notch</text>

  <!-- Hearth board -->
  <rect class="thin" x="88" y="118" width="284" height="290" rx="22" />
  <text class="label" x="102" y="146">Hearth board</text>

  <!-- Cup (depression) -->
  <circle class="line" cx="320" cy="188" r="16" />
  <circle class="accent" cx="320" cy="188" r="6" />
  <text class="label" x="100" y="182">Cup (socket)</text>
  <path class="thin" d="M 196 186 L 302 188" />

  <!-- Notch: narrow pie-slice from the board edge into the cup -->
  <path class="line" d="M 372 168 L 332 188 L 372 208 Z" />
  <text class="label" x="100" y="224">Notch (pie-slice cut)</text>
  <path class="thin" d="M 256 219 L 344 196" />

  <!-- Dust pan (bark/leaf) slid under the board beneath the notch -->
  <path class="thin" d="M 372 150 C 406 154, 424 170, 426 192 C 424 214, 404 232, 372 236" />
  <text class="label" x="96" y="436">Dust pan (bark / leaf) under the notch</text>
  <path class="thin" d="M 348 430 L 402 232" />

  <!-- Dust pile -->
  <circle class="accent2" cx="352" cy="188" r="5" />
  <circle class="accent2" cx="398" cy="192" r="6" />
  <text class="label" x="96" y="470">Goal: dark dust collects in the notch + pan</text>

  <!-- Panel B: Motion + forces (no human drawing) -->
  <rect class="panel" x="468" y="30" width="404" height="460" rx="18" />
  <text class="title" x="492" y="68">Schematic: motion + forces</text>

  <!-- Ground line -->
  <path class="thin" d="M 510 404 L 830 404" />

  <!-- Hearth board (side view) -->
  <rect class="thin" x="560" y="360" width="230" height="44" rx="10" />
  <text class="label" x="570" y="386">Hearth</text>

  <!-- Pinning force -->
  <text class="label" x="492" y="304">Pin board firmly</text>
  <text class="label" x="492" y="322">(body weight)</text>
  <path class="thin" d="M 600 332 L 600 352" />
  <path class="thin" d="M 592 344 L 600 352 L 608 344" />

  <!-- Spindle -->
  <path class="line" d="M 700 140 L 700 360" />
  <circle class="accent" cx="700" cy="360" r="6" />
  <text class="label" x="736" y="178">Spindle</text>
  <path class="thin" d="M 720 174 L 706 200" />

  <!-- Downward pressure + hand travel -->
  <text class="label" x="492" y="126">Palms slide down; return quickly</text>
  <text class="label" x="492" y="150">Increase pressure + speed</text>
  <text class="label" x="492" y="172">near the end</text>
  <path class="thin" d="M 658 192 L 658 252" />
  <path class="thin" d="M 650 244 L 658 252 L 666 244" />

  <!-- Spin arrow -->
  <path class="thin" d="M 772 224 C 800 240, 802 276, 776 294" />
  <path class="thin" d="M 774 216 L 792 220 L 784 236" />
  <path class="thin" d="M 774 302 L 792 298 L 784 282" />
  <text class="label" x="812" y="262">Spin</text>

  <!-- Notes -->
  <text class="label" x="492" y="458">Keep the spindle vertical; keep the notch open to airflow.</text>
</svg>
