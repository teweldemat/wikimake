<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <style>
      .panel { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.12; }
      .line { fill: none; stroke: #eef2f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .wood { fill: #6b5337; stroke: #8a6a4f; stroke-width: 1.5; }
      .cover { fill: #2f3642; stroke: #b4c0cb; stroke-opacity: 0.4; }
      .flame { fill: #e6c36a; }
      .label { fill: #b4c0cb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
      .title { fill: #eef2f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="920" height="380" rx="18" />
  <text class="title" x="46" y="54">Charcoal pit: vent control stages (cross-section)</text>

  <!-- Stage 1: open top burn -->
  <rect class="panel" x="42" y="82" width="270" height="286" rx="14" />
  <text class="label" x="58" y="108">1) Top burn: open</text>
  <path class="thin" d="M 58 300 L 100 300 C 110 322, 244 322, 254 300 L 296 300" />
  <rect class="wood" x="118" y="282" width="118" height="16" rx="6" />
  <rect class="wood" x="126" y="264" width="102" height="16" rx="6" />
  <rect class="wood" x="136" y="246" width="82" height="16" rx="6" />
  <path class="flame" d="M 177 244 C 168 230, 172 218, 177 208 C 182 218, 188 224, 184 236 Z" />
  <path class="thin" d="M 160 200 C 168 184, 158 172, 166 156" />
  <path class="thin" d="M 184 196 C 192 180, 182 168, 190 152" />
  <path class="thin" d="M 206 204 C 214 188, 204 176, 212 160" />
  <text class="label" x="58" y="338">thick white smoke = water cooking out</text>

  <!-- Stage 2: covered with vents -->
  <rect class="panel" x="368" y="82" width="270" height="286" rx="14" />
  <text class="label" x="384" y="108">2) Cover, leave small vents</text>
  <path class="thin" d="M 384 300 L 426 300 C 436 322, 570 322, 580 300 L 622 300" />
  <rect class="wood" x="444" y="282" width="118" height="16" rx="6" />
  <rect class="wood" x="452" y="264" width="102" height="16" rx="6" />
  <path class="cover" d="M 430 300 C 440 248, 566 248, 576 300 Z" />
  <!-- vents -->
  <path class="line" d="M 462 264 L 474 258" />
  <path class="line" d="M 532 258 L 544 264" />
  <path class="thin" d="M 468 244 C 474 232, 468 224, 474 212" />
  <text class="label" x="384" y="208">thin smoke from a few vents</text>
  <path class="thin" d="M 470 212 L 478 220" />
  <text class="label" x="384" y="338">flames burst through? add more cover</text>

  <!-- Stage 3: sealed -->
  <rect class="panel" x="694" y="82" width="226" height="286" rx="14" />
  <text class="label" x="710" y="108">3) Seal + cool overnight</text>
  <path class="thin" d="M 710 300 L 740 300 C 750 322, 864 322, 874 300 L 904 300" />
  <rect class="wood" x="756" y="282" width="100" height="16" rx="6" />
  <path class="cover" d="M 744 300 C 754 240, 860 240, 870 300 Z" />
  <text class="label" x="710" y="208">no smoke, no glow:</text>
  <text class="label" x="710" y="226">all vents sealed with soil</text>
  <text class="label" x="710" y="338">open only when fully cold</text>
</svg>
