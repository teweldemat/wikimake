<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420">
  <defs>
    <style>
      .panel { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.12; }
      .line { fill: none; stroke: #eef2f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .dashed { fill: none; stroke: #67d6c2; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 5; }
      .label { fill: #b4c0cb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
      .title { fill: #eef2f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="920" height="380" rx="18" />
  <text class="title" x="46" y="54">Lashing sequence (schematic)</text>

  <!-- Step 1: anchor + first wraps -->
  <rect class="panel" x="42" y="82" width="270" height="286" rx="14" />
  <text class="label" x="58" y="108">1) Anchor + first wraps</text>
  <rect class="thin" x="66" y="206" width="222" height="22" rx="9" />
  <path class="thin" d="M 92 214 L 200 220" />
  <text class="label" x="58" y="160">end laid along, trapped under wraps</text>
  <path class="thin" d="M 130 166 L 116 208" />
  <ellipse class="line" cx="226" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="244" cy="217" rx="7" ry="22" />
  <path class="dashed" d="M 258 240 C 282 268, 268 296, 232 304" />
  <path class="dashed" d="M 246 300 L 232 304 L 240 290" />
  <text class="label" x="58" y="336">wrap over the laid end</text>

  <!-- Arrow -->
  <path class="thin" d="M 324 220 L 358 220" />
  <path class="thin" d="M 350 214 L 358 220 L 350 226" />

  <!-- Step 2: wraps under tension -->
  <rect class="panel" x="368" y="82" width="270" height="286" rx="14" />
  <text class="label" x="384" y="108">2) Wrap with constant tension</text>
  <rect class="thin" x="392" y="206" width="222" height="22" rx="9" />
  <ellipse class="line" cx="430" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="448" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="466" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="484" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="502" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="520" cy="217" rx="7" ry="22" />
  <path class="line" d="M 527 232 C 552 250, 572 270, 586 296" />
  <path class="thin" d="M 590 274 L 586 296 L 568 286" />
  <text class="label" x="384" y="160">8 to 12 touching turns; pull each tight</text>
  <text class="label" x="384" y="336">never let the band go slack</text>

  <!-- Arrow -->
  <path class="thin" d="M 650 220 L 684 220" />
  <path class="thin" d="M 676 214 L 684 220 L 676 226" />

  <!-- Step 3: lock + test -->
  <rect class="panel" x="694" y="82" width="226" height="286" rx="14" />
  <text class="label" x="710" y="108">3) Lock + test</text>
  <rect class="thin" x="714" y="206" width="186" height="22" rx="9" />
  <ellipse class="line" cx="752" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="770" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="788" cy="217" rx="7" ry="22" />
  <ellipse class="line" cx="806" cy="217" rx="7" ry="22" />
  <path class="line" d="M 812 232 C 830 244, 842 252, 852 262" />
  <circle class="line" cx="838" cy="252" r="9" />
  <circle class="line" cx="856" cy="266" r="9" />
  <text class="label" x="710" y="160">two half-hitches lock the end</text>
  <path class="thin" d="M 826 166 L 838 242" />
  <path class="thin" d="M 726 290 L 700 290" />
  <path class="thin" d="M 708 284 L 700 290 L 708 296" />
  <path class="thin" d="M 888 290 L 914 290" />
  <path class="thin" d="M 906 284 L 914 290 L 906 296" />
  <text class="label" x="710" y="336">pull hard both ways: no slide</text>
</svg>
