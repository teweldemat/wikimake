<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380">
  <defs>
    <style>
      .panel { fill: #ffffff; fill-opacity: 0.03; stroke: #ffffff; stroke-opacity: 0.12; }
      .line { fill: none; stroke: #eef2f6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .wood { fill: none; stroke: #c9a36e; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .woodthin { fill: none; stroke: #c9a36e; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #b4c0cb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .label { fill: #b4c0cb; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.01em; }
      .title { fill: #eef2f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; }
      .accent { fill: #e6c36a; }
    </style>
  </defs>

  <rect class="panel" x="20" y="20" width="920" height="340" rx="18" />
  <text class="title" x="46" y="54">Green-wood tongs: thin, bend, grip</text>

  <!-- Step 1: thin the middle -->
  <rect class="panel" x="42" y="82" width="270" height="246" rx="14" />
  <text class="label" x="58" y="108">1) Shave the middle thin</text>
  <path class="wood" d="M 70 200 L 145 200" />
  <path class="woodthin" d="M 145 202 L 210 202" />
  <path class="wood" d="M 210 200 L 285 200" />
  <path class="thin" d="M 150 168 L 178 192" />
  <text class="label" x="58" y="160">half thickness, palm-width long</text>
  <text class="label" x="58" y="296">shaved side becomes the inside</text>

  <!-- Arrow -->
  <path class="thin" d="M 324 200 L 358 200" />
  <path class="thin" d="M 350 194 L 358 200 L 350 206" />

  <!-- Step 2: bend slowly -->
  <rect class="panel" x="368" y="82" width="270" height="246" rx="14" />
  <text class="label" x="384" y="108">2) Bend in half, slowly</text>
  <path class="wood" d="M 600 156 L 444 186" />
  <path class="woodthin" d="M 444 186 C 414 194, 414 226, 444 234" />
  <path class="wood" d="M 444 234 L 600 264" />
  <path class="thin" d="M 612 186 C 626 200, 626 220, 612 234" />
  <path class="thin" d="M 606 226 L 612 234 L 620 228" />
  <text class="label" x="384" y="296">ease it closed over a slow count of ten</text>

  <!-- Arrow -->
  <path class="thin" d="M 650 200 L 684 200" />
  <path class="thin" d="M 676 194 L 684 200 L 676 206" />

  <!-- Step 3: grip -->
  <rect class="panel" x="694" y="82" width="226" height="246" rx="14" />
  <text class="label" x="710" y="108">3) Flat tips grip the work</text>
  <path class="woodthin" d="M 724 196 C 710 204, 710 224, 724 232" />
  <path class="wood" d="M 724 196 L 856 178" />
  <path class="wood" d="M 724 232 L 856 250" />
  <circle class="accent" cx="876" cy="214" r="16" />
  <path class="thin" d="M 856 178 L 872 200" />
  <path class="thin" d="M 856 250 L 872 228" />
  <text class="label" x="710" y="296">test: lift an egg-sized stone</text>
</svg>
